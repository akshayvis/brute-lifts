name: Apply future schedule update
on:
  push:
    branches: [future-schedule-and-recovery]
    paths: [.github/workflows/apply-future-schedule.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: future-schedule-and-recovery
      - name: Apply prepared source changes
        run: |
          echo '' | base64 --decode | gzip --decompress | git apply
          node --experimental-strip-types tests/model.test.mjs
          corepack enable
          pnpm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/model.ts app/journal.tsx app/globals.css tests/model.test.mjs
          git commit -m "Add future workout schedule and recovery days"
          git rm .github/workflows/apply-future-schedule.yml
          git commit -m "Remove temporary apply workflow"
          git push origin HEAD:future-schedule-and-recovery
