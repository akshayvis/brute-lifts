name: Apply prepared training improvements

on:
  push:
    branches: [flexible-sets-and-bench-rotation]
    paths:
      - scripts/apply-prepared-update.mjs
      - .github/workflows/apply-prepared-training-improvements.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flexible-sets-and-bench-rotation
      - run: node scripts/apply-prepared-update.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/model.ts app/journal.tsx app/globals.css
          git rm scripts/apply-prepared-update.mjs .github/workflows/apply-prepared-training-improvements.yml
          git commit -m "Add flexible sets and alternate bench variations"
          git push
